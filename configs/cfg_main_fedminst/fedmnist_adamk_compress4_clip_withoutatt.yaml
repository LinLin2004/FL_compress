experiment:
  name: fedmnist_adamk_compress4_clip_withoutatt
  seed: 42
  log_level: INFO
  save_path: "./results/results_main_new/fedmnist_adamk_compress4_clip_withoutatt"
resources:
  gpus:
  - 0
dataset:
  batch_size: 16
  train:
    class_path: fl_framework.data.datasets.FedMnistDataset
    params:
      data_dir: data_cache/fedmnist
      train: true
  test:
    class_path: fl_framework.data.datasets.FedMnistDataset
    params:
      data_dir: data_cache/fedmnist
      train: false
  partition:
    by_writer: true
    seed: 42
model:
  class_path: fl_framework.components.models.mnist_cnn.MNISTCNN
  params:
    in_channels: 1
    num_classes: 10
training:
  rounds: 100
  round_steps: 300
  train_loss_function:
    class_path: torch.nn.CrossEntropyLoss
  test_loss_function:
    class_path: torch.nn.CrossEntropyLoss
  metrics:
  - class_path: fl_framework.utils.metrics.TopKAccuracy
    params:
      k: 1
optimizer:
  class_path: fl_framework.components.optimizers.adamk.ADAMK
  params:
    lr: 6.5e-5
    beta1: 0.9
    beta2: 0.999
    weight_decay: 5.0e-4
    lr_decay_rate: 0.5
    lr_decay_milestone: [70]
aggregator:
  class_path: fl_framework.components.aggregators.compress4_clip.CompressAggregator
  params:
    m: 410
    r: 4
    k: 82
    krum_remain: 0.05
    byzantine_alpha: 0.2
honest:
  num_clients: 20
byzantine:
  num_clients: 0
  attack:
    class_path: fl_framework.components.attacks.foe.FOE
    params: {}
